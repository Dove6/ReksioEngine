<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>[PRGJ 2025] Chicken Evaders - Powered by ReksioEngine</title>
        <link rel="icon" type="image/png" href="./favicon.png" />
        <style>
            body {
                padding: 0;
                margin: 0;
            }

            #game {
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
                color: #fff;
            }

            .notready:before {
                content: 'Click to begin';
                font-family: sans-serif;
                font-size: 24px;
            }

            #game > canvas {
                aspect-ratio: 4/3;
                width: 100vw;
            }

            @media (min-aspect-ratio: 4/3) {
                #game > canvas {
                    width: calc(100vh * 4 / 3);
                }
            }
        </style>
    </head>
    <body>
        <div id="game"></div>
    </body>
</html>
